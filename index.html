<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⭐ Кликер</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game">
    <!-- Хедер -->
    <div class="header">
      <h1>⭐ Кликер</h1>
      <div class="stats">
        <span>⚡<strong id="clickPower">1</strong></span>
        <span>🤖<strong id="autoPower">0</strong></span>
      </div>
    </div>

    <!-- Баланс -->
    <div class="balance">
      <span id="resources">0</span> <small>🪐</small>
    </div>

    <!-- Планета -->
    <div class="clicker" id="clickArea" role="button">
      <div class="planet" id="planet">🪐</div>
      <div class="hint">нажми</div>
      <div class="click-counter">👆 <strong id="clickCount">0</strong></div>
    </div>

    <!-- Улучшения -->
    <div class="upgrades">
      <div class="upgrade" id="upgradeClick">
        <div class="info">
          <div class="icon">⚡</div>
          <div class="desc">
            <strong>Сила клика</strong>
            <small>+1 за клик</small>
          </div>
        </div>
        <div class="cost"><span>🪐</span><span id="clickCost">10</span></div>
        <button class="btn" id="buyClick">Купить</button>
      </div>
      
      <div class="upgrade" id="upgradeAuto">
        <div class="info">
          <div class="icon">🤖</div>
          <div class="desc">
            <strong>Авто-дрон</strong>
            <small>+1/сек</small>
          </div>
        </div>
        <div class="cost"><span>🪐</span><span id="autoCost">20</span></div>
        <button class="btn" id="buyAuto">Купить</button>
      </div>
    </div>

    <!-- Футер -->
    <div class="footer">
      <span class="total-clicks">Всего кликов: <strong id="totalClicks">0</strong></span>
      <button class="reset" id="reset">⟳ сброс</button>
    </div>
    <div class="save-status" id="saveStatus">💾 автосохранение</div>
  </div>

  <!-- Подключаем JS -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/api.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/combo.js"></script>
  <script src="js/prestige.js"></script>
  <script src="js/app.js"></script>
</body>
  </html>
