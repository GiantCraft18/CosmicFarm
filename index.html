<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⭐ Кликер</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
    body{min-height:100dvh;display:flex;justify-content:center;align-items:center;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0a0e1a;padding:12px;touch-action:manipulation;overflow:hidden}
    .game{max-width:min(420px,95vw);width:100%;max-height:98dvh;overflow-y:auto;background:linear-gradient(145deg,#141b33,#0b1022);border-radius:clamp(28px,5vw,40px);padding:clamp(16px,3vw,24px) clamp(14px,2.5vw,20px) clamp(20px,3.5vw,28px);box-shadow:0 20px 60px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06);scrollbar-width:thin;scrollbar-color:#2d4d7a transparent}
    .game::-webkit-scrollbar{width:4px}
    .game::-webkit-scrollbar-track{background:transparent}
    .game::-webkit-scrollbar-thumb{background:#2d4d7a;border-radius:10px}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(8px,2vw,12px);flex-wrap:wrap;gap:6px}
    .header h1{font-size:clamp(1.2rem,4vw,1.6rem);font-weight:600;background:linear-gradient(135deg,#8ab4ff,#4a7fff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .stats{display:flex;gap:clamp(4px,1.5vw,8px);background:rgba(255,255,255,.04);border-radius:60px;padding:clamp(4px,1vw,6px) clamp(10px,2vw,14px);flex-wrap:wrap}
    .stats span{color:#8a9fc7;font-size:clamp(.6rem,1.8vw,.8rem);display:flex;align-items:center;gap:4px;white-space:nowrap}
    .stats strong{color:#fff;font-weight:600}
    .balance{text-align:center;margin:clamp(-4px,-1vw,-6px) 0 clamp(8px,2vw,12px);font-size:clamp(1.4rem,4.5vw,2rem);font-weight:700;color:#fff;text-shadow:0 0 20px rgba(59,110,255,.3)}
    .balance small{font-size:clamp(.7rem,1.8vw,.85rem);color:#6d8fc9;font-weight:400}
    .clicker{background:radial-gradient(circle at 30% 25%,#1f3a6b,#0b152b);border-radius:50%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:clamp(4px,1.5vw,8px) auto clamp(12px,2.5vw,16px);cursor:pointer;touch-action:none;transition:transform .08s,box-shadow .08s;box-shadow:inset 0 -6px 0 #0a1628,0 12px 40px rgba(0,20,80,.5);border:1px solid rgba(100,160,255,.15);width:min(65vw,280px);max-width:280px;position:relative;-webkit-touch-callout:none}
    .clicker:hover:not(:active){transform:scale(1.02);box-shadow:inset 0 -6px 0 #0a1628,0 15px 50px rgba(0,20,80,.7)}
    .clicker:active{transform:scale(.95);box-shadow:inset 0 -3px 0 #0a1628,0 8px 30px rgba(0,20,80,.4)}
    .clicker .planet{font-size:clamp(4rem,18vw,6rem);line-height:1;filter:drop-shadow(0 0 30px #3f7bff);transition:transform .08s;pointer-events:none;will-change:transform}
    .clicker:active .planet{transform:scale(.9) rotate(3deg)}
    .clicker .hint{color:#6d8fc9;font-size:clamp(.6rem,1.6vw,.8rem);margin-top:4px;background:rgba(0,0,0,.3);padding:3px 14px;border-radius:40px;pointer-events:none}
    .click-counter{position:absolute;bottom:clamp(8px,2vw,12px);right:clamp(10px,2.5vw,16px);background:rgba(0,0,0,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:2px clamp(8px,1.5vw,12px);border-radius:20px;font-size:clamp(.5rem,1.4vw,.7rem);color:#6d8fc9;border:1px solid rgba(255,255,255,.05);pointer-events:none}
    .click-counter strong{color:#fff;font-weight:500}
    .upgrades{display:flex;flex-direction:column;gap:clamp(8px,2vw,10px);margin:clamp(8px,2vw,10px) 0 clamp(6px,1.5vw,8px)}
    .upgrade{background:rgba(255,255,255,.03);border-radius:clamp(40px,8vw,60px);padding:clamp(6px,1.5vw,8px) clamp(12px,2.5vw,16px) clamp(6px,1.5vw,8px) clamp(16px,3vw,20px);display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(255,255,255,.06);gap:clamp(4px,1.5vw,8px);flex-wrap:wrap;transition:background .15s,border-color .15s}
    .upgrade:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
    .upgrade .info{display:flex;align-items:center;gap:clamp(8px,2vw,12px);flex:1;min-width:clamp(100px,25vw,120px)}
    .upgrade .icon{font-size:clamp(1.2rem,3.5vw,1.8rem);flex-shrink:0}
    .upgrade .desc{color:#a8bde0;min-width:0}
    .upgrade .desc strong{display:block;color:#fff;font-size:clamp(.85rem,2.4vw,1.05rem);font-weight:500;line-height:1.2}
    .upgrade .desc small{color:#6a83af;font-size:clamp(.6rem,1.6vw,.8rem)}
    .upgrade .cost{background:rgba(0,0,0,.3);padding:clamp(3px,.8vw,4px) clamp(10px,2vw,14px);border-radius:40px;color:#fcd34d;font-weight:600;font-size:clamp(.8rem,2.2vw,1rem);white-space:nowrap;flex-shrink:0}
    .upgrade .cost span{color:#fbbf24;margin-right:2px}
    .btn{background:linear-gradient(145deg,#3b6eff,#1a4ac8);border:none;color:#fff;font-weight:600;font-size:clamp(.85rem,2.2vw,1.05rem);padding:clamp(5px,1.2vw,6px) clamp(14px,3vw,18px);border-radius:40px;min-width:clamp(60px,16vw,70px);cursor:pointer;box-shadow:0 4px 0 #0f2760;transition:transform .07s,box-shadow .07s;border:1px solid rgba(255,255,255,.1);touch-action:manipulation;-webkit-touch-callout:none;flex-shrink:0;position:relative;overflow:hidden}
    .btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(255,255,255,.1) 0%,transparent 60%);opacity:0;transition:opacity .3s}
    .btn:active::after{opacity:1}
    .btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0f2760}
    .btn:disabled{opacity:.35;transform:translateY(2px);box-shadow:0 2px 0 #0f2760;pointer-events:none}
    .btn:hover:not(:disabled){background:linear-gradient(145deg,#4a7aff,#2555d8);box-shadow:0 4px 0 #0f2760,0 4px 15px rgba(59,110,255,.3)}
    .footer{display:flex;justify-content:space-between;align-items:center;margin-top:clamp(10px,2.5vw,14px);gap:clamp(6px,2vw,10px);flex-wrap:wrap}
    .total-clicks{color:#4a6a8f;font-size:clamp(.55rem,1.4vw,.7rem)}
    .reset{background:transparent;border:1px solid rgba(255,255,255,.08);color:#6a83af;padding:clamp(4px,1vw,6px) clamp(14px,3vw,20px);border-radius:40px;font-size:clamp(.65rem,1.6vw,.85rem);cursor:pointer;transition:all .15s;touch-action:manipulation}
    .reset:active{transform:scale(.95)}
    .reset:hover{background:rgba(255,60,60,.1);border-color:#ff7a86;color:#ffb3bb}
    .save-status{color:#3a6a5f;font-size:clamp(.45rem,1.2vw,.6rem);text-align:right;margin-top:4px;opacity:.7;transition:color .3s}
    .float{position:fixed;pointer-events:none;font-weight:700;font-size:clamp(1.8rem,6vw,2.6rem);color:#b7e1ff;text-shadow:0 0 20px #3d8eff,0 0 40px #0044ff;z-index:999;animation:floatUp 1s ease-out forwards}
    @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-140px) scale(1.3)}}
    @keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}}
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
    @media(max-width:480px){body{padding:8px;align-items:flex-start;padding-top:12px}.game{border-radius:24px;padding:14px 12px 18px;max-height:100dvh}.clicker{width:min(70vw,220px)}.upgrade{padding:6px 10px 6px 14px;border-radius:32px}.btn{min-width:54px;padding:5px 10px;font-size:.8rem}.stats{padding:4px 10px}}
    @media(max-width:380px){.stats{flex-direction:column;align-items:center;gap:2px;padding:4px 8px}.upgrade .info{min-width:80px}.clicker{width:min(75vw,180px)}}
    @media(min-width:768px){.game{padding:32px 28px 36px}.clicker{width:280px}.clicker:hover:not(:active){transform:scale(1.03)}}
    @media(orientation:landscape) and (max-height:500px){.game{max-height:95dvh;padding:12px 16px 16px}.clicker{width:min(40vw,180px);margin:4px auto 10px}.clicker .planet{font-size:clamp(3rem,12vw,4rem)}.balance{font-size:clamp(1.2rem,3vw,1.6rem);margin:0 0 6px}.upgrades{gap:6px;margin:6px 0 4px}.upgrade{padding:4px 10px 4px 14px}.header{margin-bottom:6px}}
    @media(prefers-color-scheme:light){body{background:#e8ecf5}.game{background:linear-gradient(145deg,#f0f4ff,#dce3f5);box-shadow:0 20px 60px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.5)}.header h1{background:linear-gradient(135deg,#2d6eff,#1a4ac8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.stats{background:rgba(0,0,0,.05)}.stats span{color:#5a6f8f}.stats strong{color:#1a2a4a}.balance{color:#1a2a4a}.balance small{color:#5a6f8f}.clicker{background:radial-gradient(circle at 30% 25%,#8ab4ff,#4a7fff);box-shadow:inset 0 -6px 0 #2d5a9a,0 12px 40px rgba(0,20,80,.2)}.upgrade{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.08)}.upgrade .desc{color:#4a5f7f}.upgrade .desc strong{color:#1a2a4a}.upgrade .desc small{color:#6a83af}.total-clicks{color:#6a83af}.save-status{color:#3a7a5f}}
  </style>
</head>
<body>
<div class="game">
  <div class="header">
    <h1>⭐ Кликер</h1>
    <div class="stats">
      <span>⚡<strong id="clickPower">1</strong></span>
      <span>🤖<strong id="autoPower">0</strong></span>
    </div>
  </div>

  <div class="balance">
    <span id="resources">0</span> <small>🪐</small>
  </div>

  <div class="clicker" id="clickArea" role="button" aria-label="Кликни чтобы собрать ресурсы">
    <div class="planet" id="planet">🪐</div>
    <div class="hint">нажми</div>
    <div class="click-counter">👆 <strong id="clickCount">0</strong></div>
  </div>

  <div class="upgrades">
    <div class="upgrade">
      <div class="info">
        <div class="icon">⚡</div>
        <div class="desc">
          <strong>Сила клика</strong>
          <small>+1 за клик</small>
        </div>
      </div>
      <div class="cost"><span>🪐</span><span id="clickCost">10</span></div>
      <button class="btn" id="buyClick" aria-label="Купить усиление клика">Купить</button>
    </div>
    <div class="upgrade">
      <div class="info">
        <div class="icon">🤖</div>
        <div class="desc">
          <strong>Авто-дрон</strong>
          <small>+1/сек</small>
        </div>
      </div>
      <div class="cost"><span>🪐</span><span id="autoCost">20</span></div>
      <button class="btn" id="buyAuto" aria-label="Купить авто-дрон">Купить</button>
    </div>
  </div>

  <div class="footer">
    <span class="total-clicks">Всего кликов: <strong id="totalClicks">0</strong></span>
    <button class="reset" id="reset" aria-label="Сбросить прогресс">⟳ сброс</button>
  </div>
  <div class="save-status" id="saveStatus">💾 автосохранение</div>
</div>

<script>
// ====== КОНФИГУРАЦИЯ ======
const CONFIG = {
  SAVE_INTERVAL: 3000,
  CLICK_COST_MULT: 1.8,
  AUTO_COST_MULT: 2.0,
  API_URL: 'save.php',
  MAX_RESOURCES: 1e12,
  FLOAT_DURATION: 1000,
  ANIMATION_DELAY: 100,
  MAX_PARTICLES: 8
};

// ====== УТИЛИТЫ ======
const Utils = {
  formatNumber(num) {
    if (num >= 1e9) return (num / 1e9).toFixed(1) + 'B';
    if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
    if (num >= 1e3) return (num / 1e3).toFixed(1) + 'K';
    return Math.floor(num);
  },
  clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  },
  debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
      const later = () => {
        clearTimeout(timeout);
        func(...args);
      };
      clearTimeout(timeout);
      timeout = setTimeout(later, wait);
    };
  },
  isMobile() {
    return /Android|iPhone|iPad|iPod|BlackBerry|Opera Mini|IEMobile/i.test(navigator.userAgent) || window.innerWidth < 768;
  },
  getPointerPosition(e) {
    if (e.changedTouches) {
      return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    }
    if (e.touches) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX || 0, y: e.clientY || 0 };
  }
};

// ====== СОСТОЯНИЕ ======
class GameState {
  constructor() {
    this.resources = 0;
    this.clickPower = 1;
    this.autoPower = 0;
    this.clickCost = 10;
    this.autoCost = 20;
    this.totalClicks = 0;
    this.lastSave = Date.now();
    this.clickMultiplier = 1;
    this.autoMultiplier = 1;
  }
  load(data) { Object.assign(this, data); }
  reset() { Object.assign(this, new GameState()); }
  serialize() {
    return {
      resources: this.resources,
      clickPower: this.clickPower,
      autoPower: this.autoPower,
      clickCost: this.clickCost,
      autoCost: this.autoCost,
      totalClicks: this.totalClicks,
      clickMultiplier: this.clickMultiplier,
      autoMultiplier: this.autoMultiplier
    };
  }
  getClickPower() { return this.clickPower * this.clickMultiplier; }
  getAutoPower() { return this.autoPower * this.autoMultiplier; }
}

// ====== DOM УПРАВЛЕНИЕ ======
class DOMController {
  constructor() {
    this.elements = {
      resources: document.getElementById('resources'),
      clickPower: document.getElementById('clickPower'),
      autoPower: document.getElementById('autoPower'),
      clickCost: document.getElementById('clickCost'),
      autoCost: document.getElementById('autoCost'),
      clickCount: document.getElementById('clickCount'),
      totalClicks: document.getElementById('totalClicks'),
      buyClick: document.getElementById('buyClick'),
      buyAuto: document.getElementById('buyAuto'),
      planet: document.getElementById('planet'),
      saveStatus: document.getElementById('saveStatus'),
      clickArea: document.getElementById('clickArea')
    };
  }
  update(state) {
    this.elements.resources.textContent = Utils.formatNumber(state.resources);
    this.elements.clickPower.textContent = state.getClickPower();
    this.elements.autoPower.textContent = state.getAutoPower();
    this.elements.clickCost.textContent = Utils.formatNumber(state.clickCost);
    this.elements.autoCost.textContent = Utils.formatNumber(state.autoCost);
    this.elements.clickCount.textContent = state.totalClicks;
    this.elements.totalClicks.textContent = state.totalClicks;
    this.elements.buyClick.disabled = state.resources < state.clickCost;
    this.elements.buyAuto.disabled = state.resources < state.autoCost;
  }
  animatePlanet() {
    const p = this.elements.planet;
    p.style.transform = 'scale(.88) rotate(3deg)';
    setTimeout(() => p.style.transform = '', CONFIG.ANIMATION_DELAY);
  }
  glowPlanet(color = '#aaff88') {
    const p = this.elements.planet;
    p.style.textShadow = `0 0 40px ${color},0 0 80px ${color}`;
    setTimeout(() => p.style.textShadow = '', 200);
  }
  highlightCounter() {
    const cc = this.elements.clickCount;
    cc.style.color = '#8ab4ff';
    setTimeout(() => cc.style.color = '', 200);
  }
  setSaveStatus(text, isError = false) {
    const el = this.elements.saveStatus;
    el.textContent = text;
    el.style.color = isError ? '#8f4a5a' : '#3a6a5f';
    clearTimeout(this._statusTimeout);
    this._statusTimeout = setTimeout(() => {
      el.textContent = '💾 автосохранение';
      el.style.color = '#3a6a5f';
    }, 2000);
  }
  shakeElement(element) {
    const el = typeof element === 'string' ? document.getElementById(element) : element;
    if (!el) return;
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = 'shake 100ms ease-in-out';
    setTimeout(() => el.style.animation = '', 100);
  }
}

// ====== ВИЗУАЛЬНЫЕ ЭФФЕКТЫ ======
class VisualEffects {
  static showFloatingText(x, y, amount, color = '#b7e1ff') {
    const el = document.createElement('div');
    el.className = 'float';
    el.textContent = `+${Math.floor(amount)}`;
    el.style.left = (x - 40) + 'px';
    el.style.top = (y - 30) + 'px';
    el.style.color = color;
    el.style.textShadow = `0 0 20px ${color},0 0 40px ${color}`;
    document.body.append(el);
    setTimeout(() => el.remove(), CONFIG.FLOAT_DURATION);
  }
  static createParticles(x, y, count = CONFIG.MAX_PARTICLES) {
    const colors = ['#3b6eff', '#8ab4ff', '#fcd34d', '#aaff88', '#ff6b6b', '#ff9ff3'];
    for (let i = 0; i < Math.min(count, 12); i++) {
      const particle = document.createElement('div');
      const size = 3 + Math.random() * 4;
      const angle = Math.random() * Math.PI * 2;
      const distance = 40 + Math.random() * 60;
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance - 20;
      particle.style.cssText = `
        position:fixed;pointer-events:none;width:${size}px;height:${size}px;
        background:${colors[Math.floor(Math.random() * colors.length)]};
        border-radius:50%;left:${x}px;top:${y}px;z-index:998;
        animation:particleFly ${0.6 + Math.random() * 0.4}s ease-out forwards;
        --tx:${tx}px;--ty:${ty}px;box-shadow:0 0 6px rgba(255,255,255,0.3)
      `;
      document.body.append(particle);
      setTimeout(() => particle.remove(), 1000);
    }
  }
}

// ====== API КЛИЕНТ ======
class ApiClient {
  static async request(action, data = null, retries = 2) {
    for (let i = 0; i < retries; i++) {
      try {
        const response = await fetch(CONFIG.API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, data })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        if (result.success === false && result.error) {
          throw new Error(result.error);
        }
        return result;
      } catch (error) {
        if (i === retries - 1) throw error;
        await new Promise(resolve => setTimeout(resolve, 1000 * (i + 1)));
      }
    }
  }
  static async save(data) {
    try {
      return await this.request('save', data);
    } catch (error) {
      console.error('Save error:', error);
      return { success: false, error: error.message };
    }
  }
  static async load() {
    try {
      return await this.request('load');
    } catch (error) {
      console.error('Load error:', error);
      return { success: false, error: error.message };
    }
  }
}

// ====== ОСНОВНОЙ КЛАСС ИГРЫ ======
class Game {
  constructor() {
    this.state = new GameState();
    this.dom = new DOMController();
    this.isSaving = false;
    this.tickInterval = null;
    this.saveInterval = null;
    this.isMobile = Utils.isMobile();
    this.init();
  }
  async init() {
    try {
      await this.loadGame();
    } catch (error) {
      console.warn('Failed to load save, starting fresh');
    }
    this.setupEventListeners();
    this.startAutoTick();
    this.startAutoSave();
    this.dom.update(this.state);
    if (this.isMobile) {
      this.setupMobileOptimizations();
    }
    console.log('🚀 Game initialized!', this.isMobile ? '📱 Mobile mode' : '💻 Desktop mode');
  }
  setupMobileOptimizations() {
    const clickArea = this.dom.elements.clickArea;
    clickArea.addEventListener('touchmove', (e) => {
      e.preventDefault();
    }, { passive: false });
    if (navigator.vibrate) {
      const originalClick = this.handleClick.bind(this);
      this.handleClick = (e) => {
        navigator.vibrate && navigator.vibrate(10);
        originalClick(e);
      };
    }
  }
  setupEventListeners() {
    const clickArea = this.dom.elements.clickArea;
    const clickHandler = (e) => {
      e.preventDefault();
      this.handleClick(e);
    };
    clickArea.addEventListener('touchstart', clickHandler, { passive: false });
    clickArea.addEventListener('click', clickHandler);

    const debouncedBuy = Utils.debounce((fn) => fn(), 100);
    const buyClickHandler = (e) => {
      e.preventDefault();
      debouncedBuy(() => this.buyClickUpgrade());
    };
    const buyAutoHandler = (e) => {
      e.preventDefault();
      debouncedBuy(() => this.buyAutoUpgrade());
    };

    document.getElementById('buyClick').addEventListener('touchstart', buyClickHandler, { passive: false });
    document.getElementById('buyClick').addEventListener('click', buyClickHandler);
    document.getElementById('buyAuto').addEventListener('touchstart', buyAutoHandler, { passive: false });
    document.getElementById('buyAuto').addEventListener('click', buyAutoHandler);

    const resetHandler = (e) => {
      e.preventDefault();
      this.resetGame();
    };
    document.getElementById('reset').addEventListener('touchstart', resetHandler, { passive: false });
    document.getElementById('reset').addEventListener('click', resetHandler);

    window.addEventListener('beforeunload', () => {
      this.saveGame();
    });

    if (!this.isMobile) {
      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          this.handleClick(e);
        }
        if (e.key === '1') this.buyClickUpgrade();
        if (e.key === '2') this.buyAutoUpgrade();
        if (e.key === 'r' && (e.ctrlKey || e.metaKey)) {
          e.preventDefault();
          this.resetGame();
        }
      });
    }
  }
  handleClick(e) {
    const power = this.state.getClickPower();
    this.state.resources = Utils.clamp(this.state.resources + power, 0, CONFIG.MAX_RESOURCES);
    this.state.totalClicks++;
    this.dom.update(this.state);
    this.dom.animatePlanet();
    this.dom.highlightCounter();

    const rect = this.dom.elements.clickArea.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const pos = Utils.getPointerPosition(e);
    const x = pos.x || cx;
    const y = pos.y || cy;

    VisualEffects.showFloatingText(x, y, power);
    const particleCount = this.isMobile ? 4 : 8;
    VisualEffects.createParticles(x, y, particleCount);
  }
  buyClickUpgrade() {
    if (this.state.resources < this.state.clickCost) return;
    this.state.resources -= this.state.clickCost;
    this.state.clickPower++;
    this.state.clickCost = Math.floor(this.state.clickCost * CONFIG.CLICK_COST_MULT);
    this.dom.update(this.state);
    this.dom.glowPlanet('#3b6eff');
    this.dom.shakeElement(this.dom.elements.buyClick);
  }
  buyAutoUpgrade() {
    if (this.state.resources < this.state.autoCost) return;
    this.state.resources -= this.state.autoCost;
    this.state.autoPower++;
    this.state.autoCost = Math.floor(this.state.autoCost * CONFIG.AUTO_COST_MULT);
    this.dom.update(this.state);
    this.dom.glowPlanet('#aaff88');
    this.dom.shakeElement(this.dom.elements.buyAuto);
  }
  resetGame() {
    if (confirm('Сбросить всё? Прогресс будет потерян.')) {
      this.state.reset();
      this.dom.update(this.state);
      this.saveGame();
      this.dom.setSaveStatus('🔄 сброшено');
    }
  }
  startAutoTick() {
    if (this.tickInterval) clearInterval(this.tickInterval);
    this.tickInterval = setInterval(() => {
      const power = this.state.getAutoPower();
      if (power > 0) {
        this.state.resources = Utils.clamp(this.state.resources + power, 0, CONFIG.MAX_RESOURCES);
        this.dom.update(this.state);
        this.dom.glowPlanet('#44ff88');
      }
    }, 1000);
  }
  startAutoSave() {
    if (this.saveInterval) clearInterval(this.saveInterval);
    this.saveInterval = setInterval(() => {
      this.saveGame();
    }, CONFIG.SAVE_INTERVAL);
  }
  async saveGame() {
    if (this.isSaving) return;
    this.isSaving = true;
    try {
      const result = await ApiClient.save(this.state.serialize());
      if (result.success) {
        this.dom.setSaveStatus('✅ сохранено');
      } else {
        this.dom.setSaveStatus(`❌ ${result.error || 'ошибка'}`, true);
      }
    } catch (error) {
      this.dom.setSaveStatus('❌ ошибка сети', true);
    } finally {
      this.isSaving = false;
    }
  }
  async loadGame() {
    try {
      const result = await ApiClient.load();
      if (result.success && result.data) {
        this.state.load(result.data);
        this.dom.update(this.state);
        this.dom.setSaveStatus('✅ загружено');
        return true;
      }
    } catch (error) {
      console.warn('Load error:', error);
    }
    return false;
  }
  destroy() {
    if (this.tickInterval) clearInterval(this.tickInterval);
    if (this.saveInterval) clearInterval(this.saveInterval);
  }
}

// ====== ЗАПУСК ======
document.addEventListener('DOMContentLoaded', () => {
  window.game = new Game();
});

window.addEventListener('error', (e) => {
  console.error('Game error:', e.error);
  if (window.game) {
    window.game.dom.setSaveStatus('⚠️ ошибка', true);
  }
});
</script>
</body>
